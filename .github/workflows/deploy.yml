name: Deploy Static Site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
      
      - name: Build with Jekyll (optional)
        if: false  # 设置为 false 禁用 Jekyll
        run: |
          echo "跳过 Jekyll 构建"
          # 如果将来需要 Jekyll，在这里添加构建命令
          # bundle exec jekyll build
      
      - name: Create .nojekyll file
        run: |
          touch .nojekyll
          echo "GitHub Pages 静态站点" > .nojekyll
      
      - name: Create simple index if needed
        run: |
          if [ ! -f "index.html" ] && [ ! -f "index.md" ]; then
            cat > index.html << 'EOF'
            <!DOCTYPE html>
            <html>
            <head>
                <meta charset="utf-8">
                <title>Hulandy's Site</title>
                <style>
                    body { font-family: sans-serif; max-width: 800px; margin: 2em auto; padding: 0 1em; }
                </style>
            </head>
            <body>
                <h1>欢迎</h1>
                <p>这是一个静态站点。</p>
                <p>部署时间: $(date)</p>
            </body>
            </html>
            EOF
          fi
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
