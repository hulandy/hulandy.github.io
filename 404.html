# 创建纯 HTML 的 404 页面
cat > 404.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>404 - Page Not Found</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 800px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
            line-height: 1.6;
        }
        h1 {
            font-size: 3em;
            color: #333;
        }
        p {
            color: #666;
            font-size: 1.2em;
        }
        a {
            color: #0366d6;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>404</h1>
    <p>页面未找到</p>
    <p><a href="/">返回首页</a></p>
</body>
</html>
EOF
